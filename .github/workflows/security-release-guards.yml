name: Security and Release Guards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-release-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: Check tracked files for release/runtime artifacts
        run: python scripts/maintenance/verify_release_artifact.py --git-tracked

      - name: Build and verify source release archive
        run: |
          git archive --format=zip --output /tmp/trustinspect-release.zip HEAD
          python scripts/maintenance/verify_release_artifact.py --artifact /tmp/trustinspect-release.zip

      - name: Check runtime security guards
        run: python scripts/maintenance/check_runtime_security_guards.py

      - name: Check report templates do not embed image assets
        run: python scripts/maintenance/strip_legacy_report_assets.py --check
