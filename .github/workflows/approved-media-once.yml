name: Prepare Two Approved Media Blobs (one-time review)
on:
  pull_request:
permissions:
  contents: read
jobs:
  approved-media:
    if: github.repository == 'Synapsed-ai/trustinspect' && github.event.pull_request.number == 5 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'review/release-audit-2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare exactly the approved pixel edits
        run: |
          python -m pip install 'Pillow==12.3.0'
          python tools/prepare_presentation_media.py --source assets/screenshots --output _approved_media
      - name: Store verified binary blobs without committing or moving refs
        env:
          MEDIA_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          from PIL import Image
          expected = {'01-launcher.png': 'f2487b8fb8e15124f9288fcd4eda8a33d290326da6d1e0d9143de195e3cc7ca3',
                      '05-html-report-overview.png': 'c26cff5a3190ecad4453fd56da47a26d15db9c3ec2fb12402426280bc222debc'}
          records = []
          for name, pixels in expected.items():
              path = Path('_approved_media') / name
              assert hashlib.sha256(Image.open(path).convert('RGBA').tobytes()).hexdigest() == pixels
              data = path.read_bytes()
              payload = json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/Synapsed-ai/trustinspect/git/blobs', data=payload,
                  headers={'Authorization': 'Bearer ' + os.environ['MEDIA_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  sha = json.load(response)['sha']
              assert sha == hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              records.append({'path': 'assets/screenshots/' + name, 'sha': sha, 'pixel_sha256': pixels})
          Path('_approved_media/blob-identities.json').write_text(json.dumps(records, indent=2))
          print('APPROVED_MEDIA_BLOBS=' + json.dumps(records))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: approved-media-review-${{ github.sha }}
          path: _approved_media/
          retention-days: 90
