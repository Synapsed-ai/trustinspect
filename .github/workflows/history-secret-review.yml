name: Reachable History Secret Review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download and verify pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 -o scanner.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --retry 2 -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          lines = Path('checksums.txt').read_text().splitlines()
          expected = [x.split()[0] for x in lines if x.split()[-1].lstrip('*') == 'gitleaks_8.30.1_linux_x64.tar.gz']
          assert len(expected) == 1 and hashlib.sha256(Path('scanner.tar.gz').read_bytes()).hexdigest() == expected[0]
          PY
          tar -xzf scanner.tar.gz gitleaks
      - name: Review all fetched reachable history with redacted output
        run: python tools/history_secret_audit.py --gitleaks "$RUNNER_TEMP/gitleaks" --output _release_review/history
      - name: Preserve only sanitized locations and scan scope
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: history-secret-review-${{ github.sha }}
          path: _release_review/history/
          if-no-files-found: error
          retention-days: 90
