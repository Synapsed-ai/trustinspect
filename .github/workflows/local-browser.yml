name: Local Browser Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRUSTINSPECT_BROWSER_TESTS: '1'
      TI_BROWSER_EVIDENCE_DIR: _review_artifacts/browser
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Capture public review inputs
        run: |
          mkdir -p _review_artifacts
          git rev-parse HEAD > _review_artifacts/commit.txt
          git archive --format=zip --output=_review_artifacts/review-source.zip HEAD
          git ls-tree -r HEAD > _review_artifacts/tree.txt
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Record browser versions
        run: |
          google-chrome --version
          chromedriver --version
          python -m pip freeze > _review_artifacts/environment.txt
      - name: Exercise real Selenium on loopback-only fixtures
        run: python -m pytest -q tests/browser --junitxml=_review_artifacts/browser-tests.xml
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-browser-review-${{ github.sha }}
          path: _review_artifacts/
          if-no-files-found: error
          retention-days: 7
