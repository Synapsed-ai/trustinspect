name: Prepare reviewed source objects (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'Synapsed-ai/trustinspect' && github.head_ref == 'review/catalog-evidence-2026-10-17' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '8990496134cbc3c4219bb73fb019d76ee2961453'
          persist-credentials: false
      - name: Verify the exact reviewed patch and store resulting blobs without commits or ref changes
        env:
          OBJECT_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          endpoint = 'https://api.github.com/repos/Synapsed-ai/trustinspect/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['OBJECT_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          request = urllib.request.Request(endpoint + '/882943109a87d12160c7658d0ecf2b4413078d36', headers=headers)
          with urllib.request.urlopen(request, timeout=60) as response:
              stored_patch = json.load(response)
          patch = base64.b64decode(stored_patch['content'])
          assert hashlib.sha256(patch).hexdigest() == '10c5a4d1430cad00ae6c403b4fc21d2950f89012ac82b34aad0cf82a417fc7cd'
          expected = {
              'README.md': 'b659f7c66f263a13c933be5fc856c9f902245956',
              'docs/security/evidence-handling.md': 'd0229603adbb7c6ddd9b26ae79f98181e6d62a50',
              'examples/test_suites/owasp_llm_top10_2025_full.yaml': '6000d087234a157a5d0ea044e21376cde168eb4c',
              'examples/test_suites/owasp_llm_top10_2025_light.yaml': 'bb506b75841bbc48d351948933722846c8ae829d',
              'trustinspect/analyzers/heuristic.py': '355fab137be41e0d9dfae2f602188947a84b6ab4',
              'trustinspect/cli.py': 'b6194c80667f447a719ca4b69094aebf2a8f130f',
              'trustinspect/core/indicator_types.py': '7387b50f496b48449eaf4e39ddcf44b50a408e37',
              'trustinspect/core/versions.py': 'c6ee470cd7a8e9caf076cd46787b9f0a0d5469d1',
              'trustinspect/testcases/loader.py': '6aa1cdd87896d9290094d0e82d524123a232b163',
              'trustinspect/testcases/validator.py': '02982ddb46611c4b0dee64f44c009c693cd792ab',
          }
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == '8990496134cbc3c4219bb73fb019d76ee2961453'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) == set(expected)
          subprocess.run(['git', 'diff', '--check'], check=True)
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          outputs = {path: Path(path).read_bytes() for path in expected}
          for path, data in outputs.items():
              assert blob(data) == expected[path], path
          for path, data in outputs.items():
              body = json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode()
              request = urllib.request.Request(endpoint, data=body, headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  saved = json.load(response)
              assert saved['sha'] == expected[path]
              print('REVIEWED_SOURCE_OBJECT=' + json.dumps({'path': path, 'sha': saved['sha'], 'ref_updated': False}), flush=True)
          PY
