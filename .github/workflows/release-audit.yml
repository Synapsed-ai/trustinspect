name: Release Dependency Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Audit / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            label: linux-py310
            test_args: ''
          - os: ubuntu-latest
            python: '3.11'
            label: linux-py311
            test_args: '--tests'
          - os: ubuntu-latest
            python: '3.13'
            label: linux-py313
            test_args: ''
          - os: windows-latest
            python: '3.11'
            label: windows-py311
            test_args: ''
          - os: macos-latest
            python: '3.11'
            label: macos-py311
            test_args: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Controller TOML parser for Python 3.10
        run: python -m pip install 'tomli==2.2.1'
      - name: Build, resolve, audit and replay exact dependencies
        run: python tools/release_dependency_audit.py --output _release_review/${{ matrix.label }} ${{ matrix.test_args }}
      - name: Preserve candidate artifacts and exact environments
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dependencies-${{ matrix.label }}-${{ github.sha }}
          path: _release_review/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 90
