name: Installed Distribution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installed-wheel:
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
          - os: macos-latest
            python: '3.11'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tooling
        run: python -m pip install 'build>=1.2.2' 'twine>=6.0'
      - name: Build sdist and rebuild wheel from sdist
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Install wheel in fresh venv and test outside checkout
        run: python scripts/maintenance/verify_installed_distribution.py --json-output distribution-verification.json
