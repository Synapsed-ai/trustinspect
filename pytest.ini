[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs =
    .git
    .venv
    venv
    env
    build
    dist
    _archive
    reports
    profiles
    generated_tests
    targets/local
    targets/disabled
    *.egg-info
    __pycache__
filterwarnings =
    ignore:cannot collect test class 'TestCase'.*:pytest.PytestCollectionWarning
